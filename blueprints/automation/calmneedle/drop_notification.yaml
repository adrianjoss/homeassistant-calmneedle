blueprint:
  name: CalmNeedle - drop notification
  description: >
    Notify when the CalmNeedle score has fallen by your chosen amount since the last reset,
    then re-arm. Calm wording; no predictions, no advice - it links you to what moved and why.
    The scores in the message come from the alert sensor itself, so the reference and the
    current value always describe the same region.
  domain: automation
  source_url: https://github.com/adrianjoss/homeassistant-calmneedle/blob/main/blueprints/automation/calmneedle/drop_notification.yaml
  input:
    alert_sensor:
      name: CalmNeedle alert sensor
      default: binary_sensor.calmneedle_alert
      selector:
        entity:
          integration: calmneedle
          domain: binary_sensor
    notify_service:
      name: Notify service
      description: e.g. notify.mobile_app_my_phone
      default: notify.notify
      selector:
        text:

mode: single

triggers:
  - trigger: state
    entity_id: !input alert_sensor
    to: "on"

variables:
  alert_sensor: !input alert_sensor

actions:
  - action: !input notify_service
    data:
      title: >
        CalmNeedle: {{ state_attr(alert_sensor, 'reference_score') }} ->
        {{ state_attr(alert_sensor, 'current_score') }}
      message: >
        Down {{ state_attr(alert_sensor, 'drop') }} since your last check
        ({{ state_attr(alert_sensor, 'band') }}, {{ state_attr(alert_sensor, 'scope') }}).
        {% if state_attr(alert_sensor, 'top_event') %}Largest active event: {{ state_attr(alert_sensor, 'top_event') }}.{% endif %}
        Why it moved: https://calmneedle.com/dashboard
  - action: calmneedle.reset_alert
    target:
      entity_id: !input alert_sensor
